<VirtualHost *:80>
  DocumentRoot /opt/drupal/web
  <Directory /opt/drupal/web>
    AllowOverride All
    Require all granted
  </Directory>
  ServerSignature Off
  # Demo: zakaz indeksowania także dla plików statycznych (robots.txt, CSS, obrazy).
  # PHP zapisuje nagłówek w tabeli onsuccess; Apache jest ostatnią warstwą
  # i normalizuje obie tabele, zachowując zakaz także dla statyków i błędów.
  Header onsuccess unset X-Robots-Tag
  Header always set X-Robots-Tag "noindex, nofollow"
  ErrorLog /dev/stderr
  CustomLog /dev/stdout combined
</VirtualHost>
