name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: composer validate
        run: composer validate --no-check-publish
      - name: Składnia PHP
        run: find web/modules/custom web/themes/custom scripts docker -name '*.php' -print0 | xargs -0 -n1 php -l
  kontener:
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - name: Uruchomienie (hasła losowe tylko na czas testu)
        run: |
          cat > .env <<EOT
          SERVICE_PASSWORD_MYSQL=$(openssl rand -hex 16)
          SERVICE_PASSWORD_MYSQLROOT=$(openssl rand -hex 16)
          SERVICE_PASSWORD_64_HASHSALT=$(openssl rand -hex 32)
          SERVICE_PASSWORD_ADMIN=$(openssl rand -hex 12)
          EOT
          cat > docker-compose.ci.yml <<'EOT'
          services:
            web:
              ports: ["8080:80"]
          EOT
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          for i in $(seq 90); do curl -sf -o /dev/null http://localhost:8080/start && break; sleep 3; done
      - name: Test dymny
        run: tests/smoke.sh http://localhost:8080
      - name: Audyt WCAG (axe-core)
        run: |
          npm i --no-save axe-core@4.10.2 playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/axe.mjs http://localhost:8080
      - name: Logi
        if: failure()
        run: docker compose logs --tail=200
